<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lesson 6 — Forms. Part 1</title>
</head>
<body>

    <h1>Forms: Input Basics</h1>

    <h2>Example: Registration Form</h2>

    <form action="#" method="post">

        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"><br><br>

        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" min="1" max="120"><br><br>

        <label for="birthday">Date of Birth:</label><br>
        <input type="date" id="birthday" name="birthday"><br><br>

        <p>Topics of interest:</p>
        <input type="checkbox" id="html" name="topics" value="html">
        <label for="html">HTML</label><br>
        <input type="checkbox" id="css" name="topics" value="css">
        <label for="css">CSS</label><br>
        <input type="checkbox" id="js" name="topics" value="js">
        <label for="js">JavaScript</label><br><br>

        <p>Skill level:</p>
        <input type="radio" id="beginner" name="level" value="beginner">
        <label for="beginner">Beginner</label><br>
        <input type="radio" id="intermediate" name="level" value="intermediate">
        <label for="intermediate">Intermediate</label><br>
        <input type="radio" id="advanced" name="level" value="advanced">
        <label for="advanced">Advanced</label><br><br>

        <label for="search">Search:</label><br>
        <input type="text" id="search" name="search" placeholder="e.g. HTML course"><br><br>

        <label for="city">City:</label><br>
        <input type="text" id="city" name="city" value="Tashkent"><br><br>

        <label for="required-email">Required email:</label><br>
        <input type="email" id="required-email" name="required-email" required><br><br>

        <button type="submit">Sign Up</button>

    </form>

</body>
</html>
