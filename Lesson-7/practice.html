<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lesson 7 — Forms. Part 2</title>
</head>
<body>

    <h1>Forms: Advanced Elements and Validation</h1>

    <form action="#" method="post">

        <label for="country">Country:</label><br>
        <select id="country" name="country">
            <option value="uz" selected>Uzbekistan</option>
            <option value="kz">Kazakhstan</option>
            <option value="kg">Kyrgyzstan</option>
        </select><br><br>

        <label for="course">Choose a course:</label><br>
        <select id="course" name="course">
            <optgroup label="Frontend">
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="js">JavaScript</option>
            </optgroup>
            <optgroup label="Backend">
                <option value="php">PHP</option>
                <option value="mysql">MySQL</option>
            </optgroup>
        </select><br><br>

        <label for="bio">About me:</label><br>
        <textarea id="bio" name="bio" rows="4" cols="40"
                  placeholder="Tell us a little about yourself..."></textarea><br><br>

        <fieldset>
            <legend>Contact Details</legend>
            <label for="phone">Phone:</label><br>
            <input type="tel" id="phone" name="phone" placeholder="+998 XX XXX-XX-XX"><br><br>
            <label for="contact-email">Email:</label><br>
            <input type="email" id="contact-email" name="contact-email"><br>
        </fieldset><br>

        <fieldset>
            <legend>Skill Level</legend>
            <input type="radio" id="beg" name="level" value="beginner">
            <label for="beg">Beginner</label><br>
            <input type="radio" id="mid" name="level" value="intermediate">
            <label for="mid">Intermediate</label><br>
            <input type="radio" id="adv" name="level" value="advanced">
            <label for="adv">Advanced</label>
        </fieldset><br>

        <button type="submit">Submit Form</button>
        <button type="reset">Clear</button>

        <br><br>

        <h2>Fields with Validation</h2>

        <label for="age2">Age (16 to 99):</label><br>
        <input type="number" id="age2" name="age2" min="16" max="99"><br><br>

        <label for="username">Name (max 20 characters):</label><br>
        <input type="text" id="username" name="username" maxlength="20"><br><br>

        <label for="student-id">Student ID (exactly 7 digits):</label><br>
        <input type="text" id="student-id" name="student-id"
               pattern="[0-9]{7}"
               title="Enter exactly 7 digits"><br><br>

        <label for="name-alpha">Name (letters only):</label><br>
        <input type="text" id="name-alpha" name="name-alpha"
               pattern="[A-Za-z\s]+"
               title="Enter name using letters only"><br><br>

        <button type="submit">Submit with Validation</button>

    </form>

</body>
</html>
