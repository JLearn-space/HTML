<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lesson 4 — Images and Media</title>
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

    <h1>Images and Media on a Page</h1>

    <h2>Basic Image</h2>
    <img src="images/cat.jpg" alt="Orange cat sitting on a windowsill">
    <img src="images/cat.jpg"
         alt="Orange cat sitting on a windowsill"
         width="400"
         height="300">
    <img src="https://via.placeholder.com/300x200"
         alt="Placeholder — gray rectangle 300×200">
    <img src="images/decorative-line.png" alt="" width="300">

    <h2>Image with Caption</h2>
    <figure>
        <img src="images/chart.png" alt="Sales growth chart for 2025" width="500">
        <figcaption>Fig. 1. Company sales growth in 2025</figcaption>
    </figure>

    <h2>Image as a Link</h2>
    <a href="about.html">
        <img src="images/logo.png" alt="Company logo — go to About page" width="150">
    </a>

    <h2>Format Examples</h2>
    <figure>
        <img src="images/photo.jpg" alt="Sunset over mountains" width="400">
        <figcaption>JPEG — photograph</figcaption>
    </figure>
    <figure>
        <img src="images/logo-transparent.png" alt="Logo on transparent background" width="200">
        <figcaption>PNG — transparent background</figcaption>
    </figure>
    <figure>
        <img src="images/icon-star.svg" alt="Star icon" width="100">
        <figcaption>SVG — vector graphics</figcaption>
    </figure>

    <h2>Audio Player</h2>
    <audio controls>
        <source src="audio/music.mp3" type="audio/mpeg">
        <source src="audio/music.ogg" type="audio/ogg">
        Your browser does not support audio playback.
    </audio>

    <h2>Video Player</h2>
    <video controls width="640" height="360" poster="images/video-preview.jpg">
        <source src="video/lesson.mp4" type="video/mp4">
        <source src="video/lesson.webm" type="video/webm">
        Your browser does not support video playback.
    </video>

</body>
</html>
